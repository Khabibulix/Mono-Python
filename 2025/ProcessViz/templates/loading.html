<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title>Loading...</title>
    <style>
        body {
            background-color: #121212;
            color: #eee;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .spinner {
            border: 6px solid #444;
            border-top: 6px solid #1e90ff;
            border-radius: 50%;
            width: 60px;
            height: 60px;
            animation: spin 1s linear infinite;
            margin-bottom: 20px;
        }

        @keyframes spin {
            0%   { transform: rotate(0deg);}
            100% { transform: rotate(360deg);}
        }

        h1 {
            font-weight: normal;
            font-size: 1.5rem;
        }

        p {
            color: #aaa;
            margin-top: 0;
            font-size: 1rem;
        }
    </style>
</head>
<body>
    <div class="spinner"></div>
    <h1>Loading data...</h1>
    <p>Please be kind and wait a moment ⏳</p>
</body>
</html>
