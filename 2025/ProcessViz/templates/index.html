<html>
    <head>
        {% block head %}
            <title>Process Visualizer</title>
            <link rel="stylesheet" href="{{ url_for('static', filename='styles.css')}} ">
        {% endblock %}
    </head>
    <body>
            <h1>List of processes</h1>
            {% block content %}
                {% for k, v in get_processes.items() %}
                <div class="flex_container">
                    <table onclick="send_data(this)">
                        <caption>{{k}}</caption>
                            {% for key, value in v.items()%}
                                <tr>
                                    <th>{{key}}</th>
                                    <th class="value">{{value}}</th>
                                </tr>
                            {% endfor %}
                    <br>
                    </table>
                    <script>
                        function send_data(process) {
                            if (document.URL == 'http://localhost:5000/' ) {
                                var pid = process.querySelectorAll(".value")[0].textContent;
                                window.location.href = `process/${pid}`;
                    
                            } else {
                                console.log(document.URL)
                            }
                        }
                    </script>
                </div>
                    
                {% endfor %} 
            {%endblock%}      
        
    </body>
</html>
