<html>
    <head>
        <title>Process Visualizer</title>
        <link rel="stylesheet" href="{{ url_for('static', filename='styles.css')}} ">
    </head>
    <body>
            <h1>List of processes</h1>
            {% for k, v in get_processes.items() %}
            <div class="flex_container">
                <table style="border: 1px solid black;">
                    <caption>{{k}}</caption>
                        {% for key, value in v.items()%}
                            <tr>
                                <th>{{key}}</th>
                                <th style="font-weight: 100;" class="value">{{value}}</th>
                            </tr>
                        {% endfor %}
                <br>
                </table>
            </div>
                
            {% endfor %}       
        
    </body>
</html>
