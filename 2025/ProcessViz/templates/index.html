<html>
    <head>
        {% block head %}
            <title>Process Visualizer</title>
            <link rel="preload" href="{{ url_for('static', filename='styles.css')}} " as="style" onload="this.rel='stylesheet'">
        {% endblock %}
    </head>
    <body>
            <h1>List of processes</h1>
            <a href="{{url_for('display_process_tree')}}">See Process Tree</a>
                <div id="process-list">
                    Loading processes...
                </div>

                <script>
                        function send_data(process) {
                            console.log("Current pathname:", window.location.pathname);
                            var pid = process.dataset.pid;
                            window.location.href = `process/${pid}`;
                        }

                        async function fetchProcesses() {
                            const container = document.getElementById("process-list");
                            const scrollPos = window.scrollY;
                            
                            try {
                                const res = await fetch("/api/processes");
                                const data = await res.json();

                                if (data.status !== "ok") {
                                    container.innerHTML = "<p>Still loading...</p>";
                                } else {
                                    const processes = Object.entries(data.data).map(([name, v]) => {
                                        const rows = Object.entries(v).map(([key, value]) => {
                                            return `<tr><th>${key}</th><th class="value">${value}</th></tr>`;
                                        }).join("");

                                        return `
                                            <div class="flex_container">
                                                <table onclick="send_data(this)" data-pid="${v.PID}" style="cursor:pointer;">
                                                    <caption>${name}</caption>
                                                    ${rows}
                                                </table>
                                            </div>
                                        `;
                                    }).join("<br>");

                                    container.innerHTML = processes;
                                }
                            } catch (e) {
                                console.error("Fetch error:", e);
                                container.innerHTML = "<p>Failed to load process data </p>";
                            } finally {
                                window.scrollTo(0, scrollPos);
                                setTimeout(fetchProcesses, 10000)

                            }
                        }


                        fetchProcesses();
                        setInterval(fetchProcesses, 10000);
                    </script>    
        
    </body>
</html>
